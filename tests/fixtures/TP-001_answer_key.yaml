# TP-001 — Answer key for the synthetic test project package
#
# Generated by: make_testpack.py  (deterministic — same input, same files)
# Project:      TEST OFFICE BUILDING — PLOT 42  (synthetic, not a real project)
#
# Scoring:  recall    = found(expected_findings) / len(expected_findings)
#           precision = 1 - reported(decoys) / len(reported)
# A decoy reported is a FAILURE, weighted more heavily than a missed finding —
# per Master PRD §15: precision is prioritised over recall.

id: TP-001
name: Baseline cross-document review package
tier: 2
documents:
  - {file: 01_Employer_Requirements.pdf,  type: employer_requirements, rev: B, pages: 1}
  - {file: 02_Scope_of_Works.pdf,         type: scope_of_work,         rev: A, pages: 1}
  - {file: 03_Specification_Div07_08.pdf, type: specification,         rev: C, pages: 3}
  - {file: 04_Door_Schedule.pdf,          type: drawing_ifc,           rev: 2, pages: 2}
  - {file: 05_BOQ.xlsx,                   type: boq,                   rev: A}
  - {file: 06_Minutes_of_Meeting_AR.pdf,  type: mom,           language: ar, pages: 1}

expected_modes: [construction, design_and_build]

# ── مشاكل مزروعة — يجب اكتشافها كلها ──────────────────────────────
expected_findings:

  - id: T1
    check_type: INTERNAL_INCONSISTENCY
    severity: critical
    attribute: fire_rating
    values: [90, 60]
    unit: minutes
    evidence:
      - {doc: 03_Specification_Div07_08.pdf, page: 1, section: "01 35 23 / 1.4.A"}
      - {doc: 03_Specification_Div07_08.pdf, page: 3, section: "08 14 00 / 2.3.A"}
    corroborated_by: {doc: 06_Minutes_of_Meeting_AR.pdf, item: 2}
    notes: النظام يبلّغ عن التناقض ولا يرجّح أحد البندين

  - id: T2
    check_type: VALUE_MISMATCH
    severity: critical
    element: FD-03
    attribute: fire_rating
    values: [30, 60]
    unit: minutes
    evidence:
      - {doc: 04_Door_Schedule.pdf, page: 1, row: FD-03}
      - {doc: 03_Specification_Div07_08.pdf, page: 3, section: "08 14 00 / 2.3.A"}
    notes: FD-03 في بئر سلّم — مسار هروب محمي، فيخالف حدّي 60 و 90 معًا

  - id: T3
    check_type: MISSING_ATTRIBUTE
    severity: critical
    element: FD-07
    attribute: fire_rating
    evidence:
      - {doc: 04_Door_Schedule.pdf, page: 1, row: FD-07}
    depends_on_extraction: TC-044
    notes: >
      لا يُكتشف إطلاقًا إذا انهارت الخانة الفارغة أثناء استخراج الجدول —
      يصبح Rating = "Yes" (قيمة عمود Self Closer) ويبدو الباب سليمًا

  - id: T4
    check_type: COUNT_MISMATCH
    severity: high
    subject: fire_rated_doors
    values: [14, 12]
    evidence:
      - {doc: 04_Door_Schedule.pdf, page: 2, note: "General Note 3"}
      - {doc: 05_BOQ.xlsx, item: "8.14.03"}

  - id: T5
    check_type: MISSING_IN_BOQ
    severity: critical
    system: access_control
    evidence:
      - {doc: 01_Employer_Requirements.pdf, page: 1, section: "5.2"}
      - {doc: 02_Scope_of_Works.pdf, page: 1, section: "3.4"}
      - {doc: 05_BOQ.xlsx, absent_in_section: "28"}
    corroborated_by: {doc: 06_Minutes_of_Meeting_AR.pdf, item: 1}
    depends_on_extraction: TC-046

  - id: T6
    check_type: MISSING_IN_BOQ
    severity: critical
    system: emergency_lighting
    evidence:
      - {doc: 01_Employer_Requirements.pdf, page: 1, section: "5.4"}
      - {doc: 02_Scope_of_Works.pdf, page: 1, section: "3.6"}
      - {doc: 05_BOQ.xlsx, absent: true}
    corroborated_by: {doc: 06_Minutes_of_Meeting_AR.pdf, item: 4}

  - id: T7
    check_type: VALUE_MISMATCH
    severity: high
    attribute: roof_insulation_thickness
    values: [120, 80]
    unit: mm
    evidence:
      - {doc: 03_Specification_Div07_08.pdf, page: 2, section: "07 21 00 / 2.2.A"}
      - {doc: 04_Door_Schedule.pdf, page: 2, note: "General Note 4"}
    corroborated_by: {doc: 06_Minutes_of_Meeting_AR.pdf, item: 3}
    notes: المواصفة و BOQ متطابقان على 120 — ملاحظة الرسمة هي الشاذة

# ── فخاخ — الإبلاغ عن أي منها false positive ──────────────────────
decoys:

  - id: D1
    trap: unit_disguise
    must_not_report: VALUE_MISMATCH
    detail: ER §6.1 "10 cm" · Spec §07 21 00 "100 mm" · BOQ "100mm" — نفس القيمة

  - id: D2
    trap: synonym_wording
    must_not_report: MISSING_IN_BOQ
    detail: Scope §3.3 "CCTV System" · BOQ 28.23.01 "Video surveillance system" — موجود

  - id: D3
    trap: similar_tags
    must_not_report: ENTITY_MERGE
    detail: D-101 (900×2100) و D-101A (600×2100، درفة ثانية) — بابان مختلفان
    expected_entities: 2

  - id: D4
    trap: attribute_not_applicable
    must_not_report: MISSING_ATTRIBUTE
    detail: D-220 تيمبر غير مصنّف — تصنيف الحريق غير مطلوب له

  - id: D5
    trap: cross_language_numerals
    must_not_report: COUNT_MISMATCH
    detail: MOM "٢٤ كاميرا" · BOQ 28.23.02 "24 No." — متطابقان

# ── نتائج مقبولة بثقة منخفضة (لا تُحتسب خطأً في أي اتجاه) ─────────
acceptable_low_confidence:
  - check_type: COUNT_MISMATCH
    subject: non_rated_doors
    max_severity: medium
    must_be_presented_as: question
    detail: >
      الجدول يعرض 4 أبواب غير مصنّفة والـ BOQ يسعّر 34. ملاحظة الجدول تقول
      "on this schedule" فقد يكون مستخرجًا جزئيًا. عرضه كمخالفة قاطعة = خطأ.

# ── نتيجة أول تشغيل (2026-07-29) ──────────────────────────────────
baseline_run:
  date: 2026-07-29
  findings_recall: 7/7
  decoys_reported: 0/5
  extraction_defects_found: [TC-044, TC-045, TC-046]
  report: TP-001_first_run_result.md

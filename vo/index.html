<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سند · Sanad — سجل أوامر التغيير ومهل الإشعارات · قطر</title>
<meta name="description" content="سجل أوامر التغيير للمشاريع في قطر: تتبّع مهل الإشعارات التعاقدية، سلسلة أدلة لكل أمر، سقف الـ20% للعقود الحكومية، وتوليد الإشعار والمطالبة وملف الإسناد.">
<meta name="theme-color" content="#1f3d63">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f3d63'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' fill='%23fff' text-anchor='middle'%3E%D8%B3%3C/text%3E%3C/svg%3E">
</head>
<body>
<style>
  :root{
    --paper:#eceae5; --paper2:#f4f2ee; --card:#ffffff;
    --ink:#161a22; --muted:#666d7c; --line:#d6d3cb;
    --navy:#1f3d63; --navy-soft:#1f3d6312;
    --amber:#a97b1e; --amber-soft:#a97b1e1f;
    --red:#a32d3c;   --red-soft:#a32d3c1a;
    --green:#2c6e4f; --green-soft:#2c6e4f1a;
    --shadow:0 14px 34px rgba(28,32,38,.14);
    --ff-display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --ff-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --ff-data:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#0b0f16; --paper2:#111826; --card:#16202f;
      --ink:#e8e6df; --muted:#8b93a3; --line:#243347;
      --navy:#6fa2d8; --navy-soft:#6fa2d81a;
      --amber:#e0b055; --amber-soft:#e0b05522;
      --red:#e2848d;   --red-soft:#e2848d1f;
      --green:#6bbd92; --green-soft:#6bbd921f;
      --shadow:0 18px 44px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="light"]{
    --paper:#eceae5; --paper2:#f4f2ee; --card:#ffffff;
    --ink:#161a22; --muted:#666d7c; --line:#d6d3cb;
    --navy:#1f3d63; --navy-soft:#1f3d6312; --amber:#a97b1e; --amber-soft:#a97b1e1f;
    --red:#a32d3c; --red-soft:#a32d3c1a; --green:#2c6e4f; --green-soft:#2c6e4f1a;
    --shadow:0 14px 34px rgba(28,32,38,.14);
  }
  :root[data-theme="dark"]{
    --paper:#0b0f16; --paper2:#111826; --card:#16202f;
    --ink:#e8e6df; --muted:#8b93a3; --line:#243347;
    --navy:#6fa2d8; --navy-soft:#6fa2d81a; --amber:#e0b055; --amber-soft:#e0b05522;
    --red:#e2848d; --red-soft:#e2848d1f; --green:#6bbd92; --green-soft:#6bbd921f;
    --shadow:0 18px 44px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box}
  body{margin:0;font-family:var(--ff-body);color:var(--ink);line-height:1.5;background:var(--paper);min-height:100vh}
  .wrap{max-width:1080px;margin:0 auto;padding:16px 16px 60px}

  .top{display:flex;align-items:center;gap:10px;padding:6px 0 2px}
  .brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto}
  .mark{width:38px;height:38px;border-radius:9px;background:var(--navy);color:#fff;display:grid;place-items:center;
        font-family:var(--ff-display);font-size:21px;font-weight:600;flex:0 0 auto}
  :root[data-theme="dark"] .mark{color:#0b0f16}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mark{color:#0b0f16}}
  .brandtext strong{display:block;font-family:var(--ff-display);font-size:22px;font-weight:600;line-height:1.1}
  .brandtext span{display:block;font-family:var(--ff-data);font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
  .pill{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);
        font-size:13px;cursor:pointer;font-family:var(--ff-body);transition:all .15s}
  .pill:hover{border-color:var(--navy);color:var(--navy)}

  .projbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px;padding:12px 14px;
           background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}
  .projbar select{flex:1;min-width:170px}
  .projmeta{font-family:var(--ff-data);font-size:11px;color:var(--muted);width:100%;line-height:1.7}
  .projmeta b{color:var(--ink);font-weight:600}

  .tabs{display:flex;gap:4px;margin-top:16px;border-bottom:1px solid var(--line);overflow-x:auto}
  .tab{padding:10px 13px;border:none;background:none;color:var(--muted);font-size:14.5px;font-weight:600;
       font-family:var(--ff-body);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
  .tab.active{color:var(--navy);border-bottom-color:var(--navy)}
  .tab .dot{display:inline-block;min-width:17px;padding:0 4px;margin-inline-start:5px;border-radius:999px;
            background:var(--red);color:#fff;font-size:10.5px;font-family:var(--ff-data);vertical-align:1px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px;margin-top:16px}
  h2{font-family:var(--ff-display);font-size:21px;margin:0 0 4px;font-weight:600}
  h3{font-family:var(--ff-display);font-size:17px;margin:18px 0 6px;font-weight:600}
  .sub{font-size:13.5px;color:var(--muted);margin:0 0 12px}
  label{display:block;font-family:var(--ff-data);font-size:10px;letter-spacing:1.4px;text-transform:uppercase;
        color:var(--muted);margin:14px 0 6px;font-weight:600}
  input,select,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper2);
        color:var(--ink);font-size:15px;font-family:var(--ff-body);outline:none;transition:border-color .15s}
  input:focus,select:focus,textarea:focus{border-color:var(--navy)}
  textarea{min-height:84px;resize:vertical}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row > div{flex:1;min-width:150px}
  .btn{padding:11px 16px;border-radius:10px;border:1px solid var(--navy);background:var(--navy);color:#fff;
       font-size:14.5px;font-weight:600;font-family:var(--ff-body);cursor:pointer;transition:filter .15s}
  :root[data-theme="dark"] .btn{color:#0b0f16}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0b0f16}}
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{background:transparent;color:var(--navy);border-color:var(--line)}
  .btn.small{padding:7px 12px;font-size:13px;border-radius:9px}
  .btn.danger{background:transparent;color:var(--red);border-color:var(--red)}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .empty{padding:26px 14px;text-align:center;color:var(--muted);font-size:14px}
  .hint{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5}

  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:4px}
  .tile{background:var(--paper2);border:1px solid var(--line);border-radius:12px;padding:13px 14px}
  .tile .k{font-family:var(--ff-data);font-size:9.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);font-weight:600}
  .tile .v{font-family:var(--ff-display);font-size:25px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums;line-height:1.15}
  .tile .v .cur{font-family:var(--ff-data);font-size:11.5px;font-weight:600;color:var(--muted);margin-inline-start:4px}
  .tile.warn{background:var(--red-soft);border-color:var(--red)} .tile.warn .v{color:var(--red)}
  .tile.warn .v .cur{color:var(--red)}
  .tile.good .v{color:var(--green)} .tile.good .v .cur{color:var(--green)}

  /* --- procurement cap meter --- */
  .cap{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--paper2)}
  .caphead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:13.5px}
  .caphead b{font-family:var(--ff-display);font-size:20px}
  .caphead .of{color:var(--muted);font-size:12.5px;font-family:var(--ff-data)}
  .capbar{position:relative;height:16px;border-radius:999px;background:var(--line);margin-top:10px;overflow:hidden}
  .capfill{height:100%;background:var(--green);transition:width .3s}
  .capfill.amber{background:var(--amber)} .capfill.red{background:var(--red)}
  .capmark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.45}
  .capscale{display:flex;justify-content:space-between;font-family:var(--ff-data);font-size:10px;color:var(--muted);margin-top:5px}

  /* --- risk feed --- */
  .risk{display:flex;gap:11px;padding:12px 13px;border:1px solid var(--line);border-inline-start-width:4px;
        border-radius:11px;background:var(--paper2);margin-top:9px}
  .risk.high{border-inline-start-color:var(--red);background:var(--red-soft)}
  .risk.medium{border-inline-start-color:var(--amber);background:var(--amber-soft)}
  .risk.low{border-inline-start-color:var(--muted)}
  .risk.info{border-inline-start-color:var(--navy);background:var(--navy-soft)}
  .risk .rbody{flex:1;min-width:0}
  .risk .rref{font-family:var(--ff-data);font-size:11px;color:var(--muted);cursor:pointer;text-decoration:underline;
              text-underline-offset:3px;background:none;border:none;padding:0;display:block;margin-bottom:3px}
  .risk b{display:block;font-size:14.5px;font-weight:600;margin-bottom:3px}
  .risk .why{font-size:12.5px;color:var(--muted);line-height:1.55}
  .risk .todo{font-size:13px;margin-top:6px;font-weight:600}

  .dl{display:flex;align-items:center;gap:12px;padding:12px 13px;border:1px solid var(--line);border-radius:11px;
      background:var(--paper2);margin-top:8px;cursor:pointer}
  .dl:hover{border-color:var(--navy)}
  .dl .cnt{flex:0 0 74px;text-align:center;font-family:var(--ff-display);font-size:23px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
  .dl .cnt small{display:block;font-family:var(--ff-data);font-size:8.5px;letter-spacing:1.2px;text-transform:uppercase;font-weight:600;opacity:.85}
  .dl .body{flex:1;min-width:0}
  .dl .body b{display:block;font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dl .body span{font-size:12.5px;color:var(--muted)}
  .dl.red{background:var(--red-soft);border-color:var(--red)} .dl.red .cnt{color:var(--red)}
  .dl.amber{background:var(--amber-soft);border-color:var(--amber)} .dl.amber .cnt{color:var(--amber)}
  .dl.green .cnt{color:var(--green)}

  .filters{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
  .fchip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);
         font-size:12.5px;font-weight:600;font-family:var(--ff-data);cursor:pointer}
  .fchip.active{background:var(--navy);color:#fff;border-color:var(--navy)}
  :root[data-theme="dark"] .fchip.active{color:#0b0f16}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fchip.active{color:#0b0f16}}
  .vo{display:flex;gap:12px;align-items:flex-start;padding:13px;border:1px solid var(--line);border-radius:11px;
      background:var(--paper2);margin-top:9px;cursor:pointer}
  .vo:hover{border-color:var(--navy)}
  .vo .ref{font-family:var(--ff-data);font-size:11.5px;color:var(--muted);flex:0 0 auto;padding-top:2px}
  .vo .main{flex:1;min-width:0}
  .vo .main b{display:block;font-size:15px;font-weight:600}
  .vo .main .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
  .vo .amt{flex:0 0 auto;text-align:end;font-family:var(--ff-data);font-size:13.5px;font-variant-numeric:tabular-nums}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-family:var(--ff-data);font-size:9.5px;
         letter-spacing:.8px;text-transform:uppercase;font-weight:600;border:1px solid}
  .b-draft{color:var(--muted);border-color:var(--line)}
  .b-notice{color:var(--amber);border-color:var(--amber);background:var(--amber-soft)}
  .b-submitted,.b-review{color:var(--navy);border-color:var(--navy);background:var(--navy-soft)}
  .b-approved{color:var(--green);border-color:var(--green);background:var(--green-soft)}
  .b-rejected,.b-disputed{color:var(--red);border-color:var(--red);background:var(--red-soft)}
  .riskdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-start:6px;vertical-align:1px}
  .riskdot.high{background:var(--red)} .riskdot.medium{background:var(--amber)}

  .modal{position:fixed;inset:0;z-index:50;background:rgba(8,11,16,.55);display:none;overflow-y:auto;padding:18px}
  .modal.open{display:block}
  .sheet{max-width:780px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:15px;
         box-shadow:var(--shadow);padding:20px}
  .sheethead{display:flex;align-items:flex-start;gap:10px}
  .sheethead h2{flex:1}
  .x{border:none;background:none;color:var(--muted);font-size:26px;line-height:1;cursor:pointer;padding:0 4px}

  .ev{display:flex;gap:10px;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--paper2);margin-top:8px}
  .ev .d{font-family:var(--ff-data);font-size:11px;color:var(--muted);flex:0 0 82px}
  .ev .t{flex:1;font-size:13.5px;min-width:0}
  .ev .t em{display:block;font-style:normal;font-family:var(--ff-data);font-size:10px;letter-spacing:1px;
            text-transform:uppercase;color:var(--muted);margin-bottom:2px}
  .ev .att{display:inline-flex;align-items:center;gap:5px;margin-top:5px;font-family:var(--ff-data);font-size:11px;
           color:var(--navy);background:none;border:1px solid var(--line);border-radius:8px;padding:3px 8px;cursor:pointer}
  .ev button.del{border:none;background:none;color:var(--muted);cursor:pointer;font-size:16px;padding:0 2px;flex:0 0 auto}
  .filepick{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}

  #docPreview{background:#fff;color:#111;padding:34px 38px;border-radius:10px;font-family:Georgia,"Times New Roman",serif;
              font-size:14px;line-height:1.65}
  #docPreview h1{font-size:17px;margin:0 0 2px;text-align:center;text-transform:uppercase;letter-spacing:1px}
  #docPreview h2{font-size:14.5px;margin:20px 0 6px;font-family:inherit}
  #docPreview .lh{text-align:center;border-bottom:1px solid #ccc;padding-bottom:12px;margin-bottom:20px}
  #docPreview .lh .co{font-size:16px;font-weight:bold;letter-spacing:.5px}
  #docPreview .lh .ad{color:#555;font-size:11.5px;white-space:pre-wrap;margin-top:3px}
  #docPreview table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12.5px}
  #docPreview th,#docPreview td{border:1px solid #bbb;padding:6px 8px;text-align:start;vertical-align:top}
  #docPreview th{background:#eee}
  #docPreview .sig{margin-top:38px;font-size:13px}
  #docPreview .kv{margin:1px 0}
  #docPreview .legal{margin-top:22px;font-size:11px;color:#666;border-top:1px solid #ddd;padding-top:8px;line-height:1.5}
  html[dir="rtl"] #docPreview{font-family:"Times New Roman",Georgia,serif}

  @media print{
    body{background:#fff}
    body *{visibility:hidden}
    #docPreview,#docPreview *{visibility:visible}
    #docPreview{position:absolute;inset-inline-start:0;top:0;width:100%;padding:0;border-radius:0;box-shadow:none}
  }
  @media (max-width:560px){
    .wrap{padding:12px 12px 50px}
    .dl .cnt{flex-basis:60px;font-size:20px}
    #docPreview{padding:20px}
  }
</style>

<div class="wrap">

  <div class="top">
    <div class="brand">
      <div class="mark">س</div>
      <div class="brandtext"><strong id="brandName"></strong><span id="brandTag"></span></div>
    </div>
    <button class="pill" id="langBtn"></button>
    <button class="pill" id="themeBtn">◐</button>
  </div>

  <div class="projbar">
    <select id="projSel"></select>
    <button class="btn small" id="newProjBtn"></button>
    <button class="btn ghost small" id="editProjBtn"></button>
    <div class="projmeta" id="projMeta"></div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="dash"></button>
    <button class="tab" data-tab="reg"></button>
    <button class="tab" data-tab="new"></button>
    <button class="tab" data-tab="data"></button>
  </div>

  <!-- ============ DASHBOARD ============ -->
  <section id="tab-dash">
    <div class="card">
      <h2 id="dashTitle"></h2>
      <p class="sub" id="dashSub"></p>
      <div class="tiles" id="tiles"></div>
      <div id="capWrap"></div>
    </div>
    <div class="card">
      <h2 id="riskTitle"></h2>
      <p class="sub" id="riskSub"></p>
      <div id="riskFeed"></div>
    </div>
    <div class="card">
      <h2 id="dlTitle"></h2>
      <p class="sub" id="dlSub"></p>
      <div id="dlBoard"></div>
    </div>
  </section>

  <!-- ============ REGISTER ============ -->
  <section id="tab-reg" hidden>
    <div class="card">
      <h2 id="regTitle"></h2>
      <p class="sub" id="regSub"></p>
      <input id="search" placeholder="">
      <div class="filters" id="filters"></div>
      <div id="regList"></div>
    </div>
  </section>

  <!-- ============ NEW VO ============ -->
  <section id="tab-new" hidden>
    <div class="card">
      <h2 id="aiTitle"></h2>
      <p class="sub" id="aiSub"></p>
      <textarea id="aiText" placeholder=""></textarea>
      <div class="btnrow">
        <button class="btn" id="aiBtn"></button>
        <button class="btn ghost" id="aiClearBtn"></button>
      </div>
      <div class="hint" id="aiStatus"></div>
    </div>

    <div class="card">
      <h2 id="newTitle"></h2>
      <p class="sub" id="newSub"></p>
      <form id="voForm">
        <div class="row">
          <div><label id="l-ref"></label><input id="f-ref" required></div>
          <div><label id="l-date"></label><input id="f-date" type="date" required>
            <div class="hint" id="f-date-hijri"></div></div>
        </div>
        <label id="l-title"></label><input id="f-title" required>
        <label id="l-desc"></label><textarea id="f-desc"></textarea>
        <div class="row">
          <div><label id="l-by"></label><input id="f-by"></div>
          <div><label id="l-src"></label><select id="f-src"></select>
            <div class="hint" id="f-src-warn"></div></div>
        </div>
        <div class="row">
          <div><label id="l-clause"></label><input id="f-clause"></div>
          <div><label id="l-cost"></label><input id="f-cost" type="number" step="any" min="0"></div>
          <div><label id="l-time"></label><input id="f-time" type="number" step="1" min="0"></div>
        </div>
        <div class="btnrow">
          <button class="btn" type="submit" id="saveVoBtn"></button>
          <button class="btn ghost" type="button" id="resetVoBtn"></button>
        </div>
      </form>
    </div>
  </section>

  <!-- ============ DATA ============ -->
  <section id="tab-data" hidden>
    <div class="card">
      <h2 id="dataTitle"></h2>
      <p class="sub" id="dataSub"></p>
      <div class="btnrow">
        <button class="btn ghost" id="expJson"></button>
        <button class="btn ghost" id="expCsv"></button>
        <button class="btn ghost" id="impBtn"></button>
        <input type="file" id="impFile" accept="application/json,.json" hidden>
      </div>
      <div class="hint" id="storageInfo"></div>
      <h3 id="demoTitle"></h3>
      <p class="sub" id="demoSub"></p>
      <div class="btnrow">
        <button class="btn ghost" id="demoBtn"></button>
        <button class="btn danger" id="wipeBtn"></button>
      </div>
      <h3 id="legalTitle"></h3>
      <div class="hint" id="legalBody"></div>
    </div>
  </section>
</div>

<!-- ============ VO DETAIL ============ -->
<div class="modal" id="voModal">
  <div class="sheet">
    <div class="sheethead">
      <h2 id="mTitle"></h2>
      <button class="x" data-close="voModal">&times;</button>
    </div>
    <div id="mBody"></div>
  </div>
</div>

<!-- ============ PROJECT ============ -->
<div class="modal" id="projModal">
  <div class="sheet">
    <div class="sheethead">
      <h2 id="pmTitle"></h2>
      <button class="x" data-close="projModal">&times;</button>
    </div>
    <form id="projForm">
      <label id="l-pname"></label><input id="p-name" required>
      <div class="row">
        <div><label id="l-pclient"></label><input id="p-client"></div>
        <div><label id="l-pemployer"></label><select id="p-employer"></select></div>
      </div>
      <div class="row">
        <div><label id="l-pcontract"></label><input id="p-contract"></div>
        <div><label id="l-psum"></label><input id="p-sum" type="number" step="any" min="0"></div>

   Sanad · سند — variation order register, Qatar edition
   The contract forms, the Civil Code checks, the procurement ceiling
   and the calendar all live in qatar.js. This file is the app around them.
   ================================================================ */

const CONFIG = { aiEndpoint: "" };   // see SETUP.md
const LS_KEY = "sanad_qa_v2";
const OLD_KEY = "sanad_v1";

let S = { projects: [], vos: [], active: null, lang: "ar", theme: "" };

/* ---------------- attachments (IndexedDB) ----------------
   Photos and PDFs are the actual evidence, and they do not fit in
   localStorage — a couple of site photos would blow the ~5MB quota and
   take the whole register down with them. Files go in IndexedDB; only
   their names and ids sit in the register.                              */
const DB_NAME = "sanad_files", DB_STORE = "files";
let dbp = null;
function db(){
  if(dbp) return dbp;
  dbp = new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => { if(!r.result.objectStoreNames.contains(DB_STORE)) r.result.createObjectStore(DB_STORE); };
    r.onsuccess = () => res(r.result);
    r.onerror  = () => rej(r.error);
  });
  return dbp;
}
async function putFile(id, blob){
  const d = await db();
  return new Promise((res, rej) => {
    const tx = d.transaction(DB_STORE, "readwrite");
    tx.objectStore(DB_STORE).put(blob, id);
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
  });
}
async function getFile(id){
  const d = await db();
  return new Promise((res, rej) => {
    const tx = d.transaction(DB_STORE, "readonly");
    const q = tx.objectStore(DB_STORE).get(id);
    q.onsuccess = () => res(q.result || null); q.onerror = () => rej(q.error);
  });
}
async function delFile(id){
  const d = await db();
  return new Promise((res) => {
    const tx = d.transaction(DB_STORE, "readwrite");
    tx.objectStore(DB_STORE).delete(id);
    tx.oncomplete = () => res(); tx.onerror = () => res();
  });
}

/* ---------------- state ---------------- */
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      S = Object.assign(S, JSON.parse(raw));
    } else {
      const old = localStorage.getItem(OLD_KEY);
      if(old) migrateV1(JSON.parse(old));
    }
    S.projects = Array.isArray(S.projects) ? S.projects : [];
    S.vos      = Array.isArray(S.vos) ? S.vos : [];
    S.projects.forEach(applyFormDefaults);
  }catch(e){ console.warn("state load failed", e); }
}
// The first version had one notice period and no contract form. Bring those
// projects forward rather than stranding anyone's register.
function migrateV1(p){
  if(!p || !Array.isArray(p.projects)) return;
  S.projects = p.projects.map(x => Object.assign({}, x, {
    form: "bespoke",
    employerType: "private",
    noticeDays: x.noticeDays || 28,
    detailDays: 0,
    contractSum: null,
    currency: x.currency === "SAR" ? "QAR" : (x.currency || "QAR"),
  }));
  S.vos = p.vos || [];
  S.active = p.active || null;
  S.lang = p.lang || "ar";
  save();
}
function applyFormDefaults(p){
  const f = CONTRACT_FORMS[p.form] || CONTRACT_FORMS.bespoke;
  p.formSrcEn = f.srcEn; p.formSrcAr = f.srcAr; p.forum = f.forum;
  p.clauseVariation = p.clauseVariation != null ? p.clauseVariation : f.clauses.variation;
}
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }
  catch(e){ console.warn("state save failed", e); alert(t().quotaFull); }
}

  const d = parseISO(s);
  if(!d) return s || "—";
  const months = S.lang === "ar"
    ? ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"]
    : ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}
// Western digits in both languages: contract sums in Qatar are written 184,000.
function fmtMoney(n, cur){
  const v = Number(n);
  if(!isFinite(v) || !v) return "—";
  return v.toLocaleString("en-US", {maximumFractionDigits:2}) + " " + (cur || "");
}

function allRisks(){
  const p = activeProject(); if(!p) return [];
  const out = [];
  projectVos().forEach(v => voRisks(v, p, S.lang).forEach(r => out.push(Object.assign({vo:v}, r))));
  projectRisks(p, projectVos(), S.lang).forEach(r => out.push(Object.assign({vo:null}, r)));
  return out.sort((a,b) => RANK[a.level] - RANK[b.level]);
}

function renderDash(){
  const L = t(), p = activeProject(), vos = projectVos();
  const cur = p ? p.currency : "";
  const open     = vos.filter(v => v.status !== "approved" && v.status !== "rejected");
  const claimed  = vos.filter(v => v.status !== "rejected").reduce((s,v) => s + (Number(v.costImpact)||0), 0);
  const approved = vos.filter(v => v.status === "approved")
                      .reduce((s,v) => s + (Number(v.amountApproved != null && v.amountApproved !== "" ? v.amountApproved : v.costImpact)||0), 0);
  const pending  = vos.filter(v => ["notice","submitted","review","disputed"].includes(v.status))
                      .reduce((s,v) => s + (Number(v.costImpact)||0), 0);
  const risk     = vos.filter(v => { const n = voDeadlines(v, p, S.lang); return n && !n.served && n.noticeLeft <= 7; }).length;
  const timeDays = vos.filter(v => v.status !== "rejected").reduce((s,v) => s + (Number(v.timeImpact)||0), 0);

  const money = (n) => Number(n)
    ? `${esc(Number(n).toLocaleString("en-US",{maximumFractionDigits:2}))}<span class="cur">${esc(cur||"")}</span>` : "—";
  $("tiles").innerHTML = [
    {k:L.t_open,     v:esc(open.length)},
    {k:L.t_claimed,  v:money(claimed)},
    {k:L.t_approved, v:money(approved), cls:approved ? "good" : ""},
    {k:L.t_pending,  v:money(pending)},
    {k:L.t_risk,     v:esc(risk), cls:risk ? "warn" : ""},
    {k:L.t_time,     v:esc(timeDays)},
  ].map(x => `<div class="tile ${x.cls||""}"><div class="k">${esc(x.k)}</div><div class="v">${x.v}</div></div>`).join("");

  // --- procurement ceiling meter, government/semi-government only
  const sum = p ? Number(p.contractSum) || 0 : 0;
  if(sum > 0 && p && (p.employerType === "government" || p.employerType === "semi")){
    const varied = vos.filter(v => v.status !== "rejected")
      .reduce((s,v) => s + (Number(v.amountApproved != null && v.amountApproved !== "" ? v.amountApproved : v.costImpact)||0), 0);
    const pct = varied / sum;
    const cls = pct >= PROCUREMENT_CAP ? "red" : pct >= CAP_WARN_AT ? "amber" : "";
    // The bar runs to 25% so the 20% ceiling sits inside the track, not at its end.
    const scale = 0.25, w = Math.min(100, (pct / scale) * 100);
    $("capWrap").innerHTML = `<div class="cap">
      <div class="caphead"><b>${(pct*100).toFixed(1)}%</b>
        <span class="of">${esc(L.capOf)} · ${esc(fmtMoney(varied, cur))} / ${esc(fmtMoney(sum, cur))}</span></div>
      <div class="capbar">
        <div class="capfill ${cls}" style="width:${w}%"></div>
        <div class="capmark" style="inset-inline-start:${(CAP_WARN_AT/scale)*100}%"></div>
        <div class="capmark" style="inset-inline-start:${(PROCUREMENT_CAP/scale)*100}%"></div>
      </div>
      <div class="capscale"><span>0%</span><span>15%</span><span>20%</span><span>25%</span></div>
      <div class="hint">${esc(L.capNote)}</div>
    </div>`;
  } else $("capWrap").innerHTML = "";

  // --- risk feed
  const risks = allRisks();
  $("riskFeed").innerHTML = risks.length ? risks.map(r => `
    <div class="risk ${r.level}">
      <div class="rbody">
        ${r.vo ? `<button class="rref" data-vo="${r.vo.id}">${esc(r.vo.ref)} — ${esc(r.vo.title)}</button>` : ""}
        <b>${esc(r.text)}</b>
        ${r.why ? `<div class="why">${esc(r.why)}</div>` : ""}
        ${r.todo ? `<div class="todo">← ${esc(r.todo)}</div>` : ""}
      </div>
    </div>`).join("") : `<div class="empty">${esc(L.riskEmpty)}</div>`;
  $("riskFeed").querySelectorAll("[data-vo]").forEach(el =>
    el.addEventListener("click", () => openVo(el.dataset.vo)));

  // --- deadline board
  const waiting = vos.filter(v => v.status === "draft")
                     .map(v => ({v, n:voDeadlines(v, p, S.lang)}))
                     .filter(x => x.n).sort((a,b) => a.n.noticeLeft - b.n.noticeLeft);
  $("dlBoard").innerHTML = waiting.length ? waiting.map(({v,n}) => {
    const late = n.noticeLeft < 0, num = Math.abs(n.noticeLeft);
    const cap  = n.noticeLeft === 0 ? L.dueToday : (late ? L.daysOver : L.daysLeft);
    return `<div class="dl ${n.state}" data-vo="${v.id}">
      <div class="cnt">${n.noticeLeft === 0 ? "!" : num}<small>${esc(cap)}</small></div>
      <div class="body">
        <b>${esc(v.ref)} — ${esc(v.title)}</b>
        <span>${esc(L.instructed)} ${esc(fmtDate(v.dateInstructed))}${v.instructedBy ? ` · ${esc(L.by)} ${esc(v.instructedBy)}` : ""}${
          n.detailDue ? ` · ${esc(L.detailDue)}: ${esc(fmtDate(isoOf(n.detailDue)))}` : ""}</span>
      </div>
    </div>`;
  }).join("") : `<div class="empty">${esc(L.dlEmpty)}</div>`;
  $("dlBoard").querySelectorAll("[data-vo]").forEach(el =>
    el.addEventListener("click", () => openVo(el.dataset.vo)));

  // --- tab badge: how many high risks
  const high = risks.filter(r => r.level === "high").length;
  document.querySelectorAll(".tab").forEach(b => {
    b.innerHTML = esc(b.dataset.label || "") +
      (b.dataset.tab === "dash" && high ? `<span class="dot">${high}</span>` : "");
  });
}

    </div>`;
  }).join("") : `<div class="empty">${esc(L.regEmpty)}</div>`;
  $("regList").querySelectorAll("[data-vo]").forEach(el =>
    el.addEventListener("click", () => openVo(el.dataset.vo)));
}

let openVoId = null;
function openVo(id){
  const L = t(), p = activeProject(), v = S.vos.find(x => x.id === id);
  if(!v || !p) return;
  openVoId = id;
  const n = voDeadlines(v, p, S.lang);
  const rs = voRisks(v, p, S.lang);
  $("mTitle").textContent = `${v.ref} — ${v.title}`;

  const statusOpts = Object.keys(L.st).map(k =>
    `<option value="${k}" ${v.status === k ? "selected" : ""}>${esc(L.st[k])}</option>`).join("");
  const ev = (v.evidence || []).slice().sort((a,b) => String(a.date).localeCompare(String(b.date)));

  $("mBody").innerHTML = `
    <div class="tiles" style="margin-bottom:6px">
      <div class="tile"><div class="k">${esc(L.instructed)}</div><div class="v" style="font-size:15px">${esc(fmtDate(v.dateInstructed))}</div></div>
      <div class="tile ${n && !n.served && n.noticeLeft < 0 ? "warn" : ""}">
        <div class="k">${esc(L.dNoticeDue)}</div>
        <div class="v" style="font-size:15px">${n ? esc(fmtDate(isoOf(n.noticeDue))) : "—"}</div></div>
      ${n && n.detailDue ? `<div class="tile"><div class="k">${esc(L.detailDue)}</div>
        <div class="v" style="font-size:15px">${esc(fmtDate(isoOf(n.detailDue)))}</div></div>` : ""}
      <div class="tile"><div class="k">${esc(L.l_cost)}</div><div class="v" style="font-size:15px">${esc(fmtMoney(v.costImpact, p.currency))}</div></div>
      <div class="tile"><div class="k">${esc(L.l_time)}</div><div class="v" style="font-size:15px">${Number(v.timeImpact)||0}</div></div>
    </div>

    <h3>${esc(L.mRisks)}</h3>
    ${rs.length ? rs.map(r => `<div class="risk ${r.level}"><div class="rbody">
        <b>${esc(r.text)}</b>
        ${r.why ? `<div class="why">${esc(r.why)}</div>` : ""}
        ${r.todo ? `<div class="todo">← ${esc(r.todo)}</div>` : ""}
      </div></div>`).join("") : `<p class="hint">${esc(L.mNoRisks)}</p>`}

    ${v.description ? `<p style="font-size:14.5px;white-space:pre-wrap;margin:14px 0 0">${esc(v.description)}</p>` : ""}
    <p class="hint">${esc(L.l_src)}: ${esc(srcLabel(v.source))}${v.instructedBy ? ` · ${esc(L.l_by)}: ${esc(v.instructedBy)}` : ""}${v.clause ? ` · ${esc(L.dClause)} ${esc(v.clause)}` : ""}</p>

    <h3>${esc(L.mStatus)}</h3>
    <div class="row">
      <div><label>${esc(L.mMove)}</label><select id="mStatusSel">${statusOpts}</select></div>
      <div><label>${esc(L.mApproved)}</label><input id="mAmt" type="number" step="any" min="0" value="${v.amountApproved != null ? esc(v.amountApproved) : ""}"></div>
    </div>
    <div class="btnrow"><button class="btn small" id="mSaveStatus">${esc(L.mSaveAmt)}</button></div>
    ${v.dateNotice ? `<p class="hint">${esc(L.mNoticeSent)} ${esc(fmtDate(v.dateNotice))}</p>` : ""}

    <h3>${esc(L.mEvidence)}</h3>
    <p class="sub">${esc(L.mEvSub)}</p>
    <div class="row">
      <div style="flex:0 0 145px"><label>${esc(L.mEvDate)}</label><input id="evDate" type="date" value="${esc(isoOf(startOfToday()))}"></div>
      <div style="flex:0 0 165px"><label>${esc(L.mEvType)}</label><select id="evType">${
        Object.keys(L.src).map(k => `<option value="${k}">${esc(L.src[k])}</option>`).join("")}</select></div>
      <div><label>${esc(L.mEvNote)}</label><input id="evNote" placeholder="${esc(L.mEvPh)}"></div>
    </div>
    <div class="btnrow">
      <label class="filepick"><input type="file" id="evFile" style="display:none">
        <button type="button" class="btn ghost small" id="evFileBtn">📎 ${esc(L.mEvFile)}</button>
        <span id="evFileName"></span></label>
      <button class="btn small" id="evAdd">${esc(L.mAddEv)}</button>
    </div>
    <div id="evList">${ ev.length ? ev.map(e => `
      <div class="ev">
        <div class="d">${esc(fmtDate(e.date))}</div>
        <div class="t"><em>${esc(srcLabel(e.type))}</em>${esc(e.note)}
          ${e.fileId ? `<button class="att" data-file="${e.fileId}" data-name="${esc(e.fileName||"file")}">📎 ${esc(e.fileName||"")}</button>` : ""}</div>
        <button class="del" data-ev="${e.id}" title="delete">&times;</button>
      </div>`).join("") : `<div class="empty">${esc(L.mEvEmpty)}</div>` }</div>

    <h3>${esc(L.mDocs)}</h3>
    <div class="btnrow">
      <button class="btn" data-doc="notice">${esc(L.mNotice)}</button>
      <button class="btn ghost" data-doc="submission">${esc(L.mSubmission)}</button>
      <button class="btn ghost" data-doc="pack">${esc(L.mPack)}</button>
    </div>
    <div class="btnrow" style="margin-top:22px">
      <button class="btn danger small" id="mDel">${esc(L.mDelete)}</button>
    </div>`;

  $("mSaveStatus").addEventListener("click", () => {
    const prev = v.status;
    v.status = $("mStatusSel").value;
    const amt = $("mAmt").value;
    v.amountApproved = amt === "" ? null : Number(amt);
    if(prev === "draft" && v.status !== "draft" && !v.dateNotice) v.dateNotice = isoOf(startOfToday());
    if(v.status === "draft") v.dateNotice = null;
    save(); renderAll(); openVo(id);
  });

  let pending = null;
  $("evFileBtn").addEventListener("click", () => $("evFile").click());
  $("evFile").addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0];
    pending = f || null;
    $("evFileName").textContent = f ? `${f.name} (${Math.round(f.size/1024)} KB)` : "";
  });
  $("evAdd").addEventListener("click", async () => {
    const note = $("evNote").value.trim();
    if(!note && !pending) return;
    const entry = { id:uid(), date:$("evDate").value || isoOf(startOfToday()),
                    type:$("evType").value, note: note || (pending ? pending.name : "") };
    if(pending){
      entry.fileId = uid(); entry.fileName = pending.name; entry.fileSize = pending.size;
      try{ await putFile(entry.fileId, pending); }
      catch(err){ console.warn("attach failed", err); delete entry.fileId; }
    }
    v.evidence = v.evidence || [];
    v.evidence.push(entry);
    save(); renderAll(); openVo(id);
  });
  $("evList").querySelectorAll("[data-ev]").forEach(b => b.addEventListener("click", async () => {
    const entry = (v.evidence || []).find(e => e.id === b.dataset.ev);
    if(entry && entry.fileId) await delFile(entry.fileId);
    v.evidence = (v.evidence || []).filter(e => e.id !== b.dataset.ev);
    save(); renderAll(); openVo(id);
  }));
  $("evList").querySelectorAll("[data-file]").forEach(b => b.addEventListener("click", async () => {
    const blob = await getFile(b.dataset.file);
    if(!blob) return;
    const url = URL.createObjectURL(blob);
    window.open(url, "_blank");
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }));

  $("mBody").querySelectorAll("[data-doc]").forEach(b =>
    b.addEventListener("click", () => buildDoc(b.dataset.doc, v, p)));

  $("mDel").addEventListener("click", async () => {
    if(!confirm(L.mDelConfirm)) return;
    for(const e of (v.evidence || [])) if(e.fileId) await delFile(e.fileId);
    S.vos = S.vos.filter(x => x.id !== id);
    save(); closeModal("voModal"); renderAll();
  });

  $("voModal").classList.add("open");
}

  if(S.lang === "ar"){
    if(kind === "notice") return (
      `نشير إلى التعليمات الموضحة أدناه، الصادرة بتاريخ ${f(v.dateInstructed)}` +
      `${v.instructedBy?` من ${v.instructedBy}`:""}${src?` عن طريق ${src}`:""}.\n\n` +
      `تُشكّل الأعمال المطلوبة تغييرًا في نطاق الأعمال${clause?` بموجب البند ${clause} من العقد`:""}. ` +
      `ووفقًا للعقد، نُشعركم بموجب هذا الكتاب بهذا التغيير وبعزمنا على المطالبة بما يترتب عليه من تعديل ` +
      `في قيمة العقد، وفي مدة الإنجاز متى انطبق ذلك.\n\n` +
      `وصف الأعمال الصادرة بها التعليمات:\n${v.description || v.title}\n\n` +
      `تقديرنا الحالي للأثر مبيّن في الجدول أدناه، وهو مقدَّم لغرض الإشعار وبناءً على المعلومات المتاحة ` +
      `بتاريخ هذا الكتاب، وليس عرض سعر نهائيًا، ونحتفظ بحقنا في تعديله بعد اكتمال تحديد الأعمال وقياس آثارها.\n\n` +
      `ويجري الاحتفاظ بسجلات آنية للموارد والوقت المستهلك، وستكون متاحة للاطلاع عند الطلب. ` +
      `وجميع حقوقنا بموجب العقد محفوظة.`);
    if(kind === "submission") return (
      `إلحاقًا بإشعارنا بأمر التغيير، نقدّم لكم أدناه تقديمنا التفصيلي لأمر التغيير الموضح، للمراجعة والتوجيه.\n\n` +
      `وصف الأعمال:\n${v.description || v.title}\n\n` +
      `صدرت التعليمات بتاريخ ${f(v.dateInstructed)}${v.instructedBy?` من ${v.instructedBy}`:""}. ` +

      `نرجو تأكيدكم الخطي للتعديل في قيمة العقد وفي مدة الإنجاز المبيّن أدناه.`);
    return (`يعرض هذا الملف، بالترتيب الزمني، السجل المؤيد لأمر التغيير الموضح أعلاه، ` +
      `وهو مُجمَّع من سجلات آنية حُفِظت وقت وقوع الأحداث، ومحفوظ لدينا وفق نموذج العقد ` +
      `(${form.ar}).`);
  }
  if(kind === "notice") return (
    `We refer to the instruction described below, issued on ${f(v.dateInstructed)}` +
    `${v.instructedBy?` by ${v.instructedBy}`:""}${src?` (${src})`:""}.\n\n` +
    `The work instructed constitutes a variation to the Works${clause?` under Clause ${clause} of the Contract`:""}. ` +
    `In accordance with the Contract we hereby give notice of that variation and of our intention to claim the ` +
    `resulting adjustment to the Contract Price and, where applicable, to the Time for Completion.\n\n` +
    `Description of the instructed work:\n${v.description || v.title}\n\n` +
    `Our present estimate of the effect is set out below. It is given for notice purposes on the information ` +
    `available at the date of this letter; it is not a fixed quotation and we reserve the right to adjust it once ` +
    `the work is fully defined and its effects measured.\n\n` +
    `Contemporary records of the resources and time expended are being kept and will be made available for ` +
    `inspection on request. All our rights under the Contract are reserved.`);
  if(kind === "submission") return (
    `Further to our notice of variation, we submit below our detailed submission for the variation described, ` +
    `for your review and instruction.\n\nDescription of the work:\n${v.description || v.title}\n\n` +
    `The instruction was issued on ${f(v.dateInstructed)}${v.instructedBy?` by ${v.instructedBy}`:""}. ` +
    `The evaluation below is made${clause?` under Clause ${clause}`:""} and is supported by the records listed ` +
    `in the schedule of supporting documents.\n\nWe request your written confirmation of the adjustment to the ` +
    `Contract Price and to the Time for Completion set out below.`);
  return (`This pack sets out, in date order, the record supporting the variation described above. It is compiled ` +
    `from contemporary records kept at the time of the events and held under the contract form (${form.en}).`);
}

async function readInstruction(){
  const L = t(), text = $("aiText").value.trim();
  if(!text){ $("aiStatus").textContent = L.aiEmpty; return; }
  $("aiStatus").textContent = L.aiWorking;

  let parsed = null, offline = false;
  if(CONFIG.aiEndpoint){
    try{
      const r = await fetch(CONFIG.aiEndpoint, {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ action:"extract", text: text.slice(0, 6000), lang: S.lang }),
      });
      const j = await r.json();
      if(j && j.vo) parsed = j.vo;
    }catch(e){ console.warn("extract failed", e); }
  }
  if(!parsed){ parsed = localExtract(text); offline = true; }
  if(!parsed){ $("aiStatus").textContent = L.aiFail; return; }

  if(parsed.title)          $("f-title").value = parsed.title;
  if(parsed.description)    $("f-desc").value  = parsed.description;
  if(parsed.dateInstructed) { $("f-date").value = parsed.dateInstructed; showHijri(); }
  if(parsed.instructedBy)   $("f-by").value    = parsed.instructedBy;
  if(parsed.source)         { $("f-src").value = parsed.source; srcWarn(); }
  if(parsed.clause)         $("f-clause").value = parsed.clause;
  if(parsed.costImpact != null && parsed.costImpact !== "") $("f-cost").value = parsed.costImpact;
  if(parsed.timeImpact != null && parsed.timeImpact !== "") $("f-time").value = parsed.timeImpact;

  $("aiStatus").textContent = offline ? L.aiOffline : L.aiDone;
}

/* Local fallback so the app is never dead without a key. It only claims what
   it can actually see; day-first is assumed on ambiguous dates, the Gulf norm. */
function localExtract(text){
  const out = {}, flat = text.replace(/\r/g, "");
  const iso = /(\d{4})-(\d{2})-(\d{2})/.exec(flat);
  const dmy = /\b(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})\b/.exec(flat);
  if(iso) out.dateInstructed = `${iso[1]}-${iso[2]}-${iso[3]}`;
  else if(dmy) out.dateInstructed = `${dmy[3]}-${String(dmy[2]).padStart(2,"0")}-${String(dmy[1]).padStart(2,"0")}`;

  const money = /(?:QAR|SAR|AED|USD|ر\.?ق|ريال|\$)\s*([\d,]+(?:\.\d+)?)|([\d,]{4,}(?:\.\d+)?)\s*(?:QAR|SAR|AED|USD|ر\.?ق|ريال)/i.exec(flat);
  if(money) out.costImpact = Number(String(money[1] || money[2]).replace(/,/g, "")) || "";

  const days = /(\d{1,3})\s*(?:calendar\s*)?(?:days?|يوم|أيام)/i.exec(flat);
  if(days) out.timeImpact = Number(days[1]);

  const clause = /(?:clause|sub-?clause|البند|بند)\s*([\d]+(?:[.\-]\d+)*)/i.exec(flat);
  if(clause) out.clause = clause[1];

  const from = /(?:^|\n)\s*(?:from|من)\s*[:：]\s*(.+)/i.exec(flat);
  if(from) out.instructedBy = from[1].trim().slice(0, 80);

  if(/verbal|شفهي|شفوي/i.test(flat))                          out.source = "verbal";
  else if(/site\s*instruction|تعليمات\s*موقع|\bSI\b/i.test(flat)) out.source = "si";
  else if(/\bRFI\b|\bTQ\b|استفسار/i.test(flat))               out.source = "rfi";
  else if(/minutes|محضر/i.test(flat))                          out.source = "minutes";
  else if(/drawing|مخطط|rev\s*[A-Z]/i.test(flat))              out.source = "drawing";
  else if(/@|subject\s*:|الموضوع\s*:/i.test(flat))             out.source = "email";

  const firstReal = flat.split("\n").map(l => l.trim())
    .filter(l => l && !/^(from|to|sent|date|subject|cc|من|إلى|التاريخ|الموضوع)\s*[:：]/i.test(l))[0] || "";
  out.title = firstReal.slice(0, 90);
  out.description = flat.slice(0, 1500);
  return out;
}

function download(name, content, type){
  const blob = new Blob([content], {type: type || "text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function exportCsv(){
  const L = t(), p = activeProject();
  const rows = [[
    "ref","title","date_instructed","instructed_by","source","clause","cost_impact","currency",
    "eot_days","status","notice_due","detail_due","notice_served","evidence_items","attachments","open_risks",
  ]];
  projectVos().forEach(v => {
    const n = voDeadlines(v, p, S.lang);

    rows.push([
      v.ref, v.title, v.dateInstructed, v.instructedBy || "", srcLabel(v.source), v.clause || "",

      (v.evidence || []).length, (v.evidence || []).filter(e => e.fileId).length,
      rs.map(r => r.text).join(" | "),
    ]);
  });
  const csv = "﻿" + rows.map(r => r.map(c => `"${String(c == null ? "" : c).replace(/"/g,'""')}"`).join(",")).join("\n");
  download(`sanad-register-${(p && p.name || "project").replace(/[^\w؀-ۿ-]+/g,"-")}.csv`, csv, "text/csv;charset=utf-8");
}

      detailDays: Math.max(0, Number($("p-detail").value) || 0),
      clauseVariation: $("p-clv").value.trim(), clauseClaim: $("p-clc").value.trim(),
      clauseEot: $("p-cle").value.trim(),
    };
    if(edit){ Object.assign(activeProject(), data); applyFormDefaults(activeProject()); }
    else { const np = Object.assign({id:uid()}, data); applyFormDefaults(np); S.projects.push(np); S.active = np.id; }
    save(); closeModal("projModal"); renderAll();
  });
  $("delProjBtn").addEventListener("click", async () => {
    if(!confirm(t().delProjConfirm)) return;
    for(const v of S.vos.filter(v => v.projectId === S.active))
      for(const e of (v.evidence || [])) if(e.fileId) await delFile(e.fileId);
    S.vos = S.vos.filter(v => v.projectId !== S.active);
    S.projects = S.projects.filter(p => p.id !== S.active);
    S.active = S.projects.length ? S.projects[0].id : null;
    save(); closeModal("projModal"); renderAll();
  });

  $("f-date").addEventListener("change", showHijri);
  $("f-src").addEventListener("change", srcWarn);

  $("voForm").addEventListener("submit", (e) => {
    e.preventDefault();
    if(!S.active){ openProjModal(false); return; }
    S.vos.push({
      id: uid(), projectId: S.active,
      ref: $("f-ref").value.trim(), title: $("f-title").value.trim(),
      description: $("f-desc").value.trim(), dateInstructed: $("f-date").value,
      instructedBy: $("f-by").value.trim(), source: $("f-src").value,
      clause: $("f-clause").value.trim(),
      costImpact: $("f-cost").value === "" ? null : Number($("f-cost").value),
      timeImpact: $("f-time").value === "" ? null : Number($("f-time").value),
      status: "draft", amountApproved: null, dateNotice: null, evidence: [],
    });
    save();
    e.target.reset();
    $("f-date").value = isoOf(startOfToday()); showHijri(); srcWarn();
    $("aiText").value = ""; $("aiStatus").textContent = t().savedVo;
    renderAll(); showTab("dash");
  });
  $("resetVoBtn").addEventListener("click", () => {
    $("voForm").reset(); $("f-date").value = isoOf(startOfToday());
    showHijri(); srcWarn(); $("aiStatus").textContent = "";
  });

  $("search").addEventListener("input", renderRegister);
  $("aiBtn").addEventListener("click", readInstruction);
  $("aiClearBtn").addEventListener("click", () => { $("aiText").value = ""; $("aiStatus").textContent = ""; });

  $("printBtn").addEventListener("click", () => window.print());
  $("copyBtn").addEventListener("click", async () => {
    try{
      await navigator.clipboard.writeText($("docPreview").innerText);
      $("copyBtn").textContent = t().copied;
      setTimeout(() => $("copyBtn").textContent = t().copy, 1600);
    }catch(e){ console.warn("clipboard blocked", e); }
  });
  $("dlHtmlBtn").addEventListener("click", () => {
    const title = $("dmTitle").textContent;
    download(`${title.replace(/[^\w؀-ۿ-]+/g,"-")}.html`,
      `<!DOCTYPE html><html lang="${S.lang}" dir="${S.lang === "ar" ? "rtl" : "ltr"}"><meta charset="utf-8">`+
      `<title>${esc(title)}</title><style>body{font-family:Georgia,serif;max-width:760px;margin:40px auto;padding:0 20px;`+
      `line-height:1.65}table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px}`+
      `th,td{border:1px solid #bbb;padding:6px 8px;text-align:start;vertical-align:top}th{background:#eee}`+
      `h1{font-size:17px;text-align:center;text-transform:uppercase;letter-spacing:1px}h2{font-size:15px;margin:20px 0 6px}`+
      `.lh{text-align:center;border-bottom:1px solid #ccc;padding-bottom:12px;margin-bottom:20px}`+
      `.lh .co{font-size:16px;font-weight:bold}.lh .ad{color:#555;font-size:12px;white-space:pre-wrap}`+
      `.legal{margin-top:22px;font-size:11px;color:#666;border-top:1px solid #ddd;padding-top:8px}</style>`+
      $("docPreview").innerHTML, "text/html;charset=utf-8");
  });

  $("expJson").addEventListener("click", () => {
    alert(t().impNoFiles);
    download(`sanad-backup-${isoOf(startOfToday())}.json`, JSON.stringify(S, null, 2), "application/json");
  });
  $("expCsv").addEventListener("click", exportCsv);
  $("impBtn").addEventListener("click", () => $("impFile").click());
  $("impFile").addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const p = JSON.parse(r.result);
        if(!p || !Array.isArray(p.projects) || !Array.isArray(p.vos)) throw new Error("shape");
        S = Object.assign(S, p);
        S.projects.forEach(applyFormDefaults);
        if(!S.active && S.projects.length) S.active = S.projects[0].id;
        save(); applyLang(); renderAll();
        alert(t().impOk);
      }catch(err){ alert(t().impFail); }
      e.target.value = "";
    };
    r.readAsText(f);
  });

  $("demoBtn").addEventListener("click", loadDemo);
  $("wipeBtn").addEventListener("click", async () => {
    if(!confirm(t().wipeConfirm)) return;
    for(const v of S.vos) for(const e of (v.evidence || [])) if(e.fileId) await delFile(e.fileId);
    S.projects = []; S.vos = []; S.active = null;
    save(); renderAll(); storageInfo();
  });
}

init();
</script>
</body>
</html>
